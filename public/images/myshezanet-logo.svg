<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">ShezaNet Network and Technology</title>
  <desc id="desc">ShezaNet logo with white Sheza text, green Net text, and network signal mark.</desc>
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#69ff20"/><stop offset="1" stop-color="#14b80f"/></linearGradient>
    <filter id="softGlow" x="-20%" y="-30%" width="140%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="420" rx="44" fill="#060916"/>
  <g transform="translate(58 40) scale(.66)">
    <g fill="none" stroke="url(#green)" stroke-linecap="round" filter="url(#softGlow)">
      <path d="M95 158c-54 57-54 139 0 196" stroke-width="34"/>
