    </g>
  </g>
  <text x="410" y="190" font-family="Arial, Helvetica, sans-serif" font-size="108" font-weight="900" letter-spacing="2"><tspan fill="#fff">SHEZA</tspan><tspan fill="#36f21b">NET</tspan></text>
  <text x="414" y="275" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="500" letter-spacing="6" fill="#36f21b">NETWORK &amp; TECHNOLOGY</text>
